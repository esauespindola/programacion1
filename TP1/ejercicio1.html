<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>:: EJERCICIO-1 ::</title>
</head>
<body>
  <script>
      let minutos, semanas, semanasRedondeo, i = 0;
     
      while (i < 15) {
       minutos = parseInt(prompt("Ingrese el valor expresado en minutos:"));
       semanas = minutos / 10080;
       semanasRedondeo = semanas.toFixed(2);

    console.log("Semanas: " + semanasRedondeo);

    i = i + 1;
}
  </script>
</body>
</html>
